[package]
name = "thadam-registry"
version = "0.1.0"
edition = "2021"
description = "Lookup-only catalogue of Thadam's test-network chains and environments."
publish = false

[dependencies]
# Intentionally empty, and it should stay that way.
#
# ARCHITECTURE.md §2 requires that mainnet parameters not exist in the binary.
# A deserialization dependency here would be the first step toward loading
# consensus constants from data at runtime, which is exactly the config file
# §2 forbids. If this crate ever needs a dependency, that is a design change
# to discuss, not a convenience to reach for.

[[bin]]
name = "dump-environments"
path = "src/bin/dump_environments.rs"
